# EJEMPLO NO ACTIVO. No copiar sobre /etc/nginx/sites-available/astro.
# La zona debe declararse una sola vez dentro del bloque http de nginx.conf:
# limit_req_zone $binary_remote_addr zone=chatbot_pacch:10m rate=3r/m;

location /chatbot-cch/ {
    limit_req zone=chatbot_pacch burst=2 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 180s;
    client_max_body_size 16k;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
